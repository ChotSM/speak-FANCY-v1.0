<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1267d6">
  <meta name="description" content="Speak FANCY: mobile-first SPM English speaking practice">
  <title>Speak FANCY</title>
  <style>
    :root{--blue:#1267d6;--navy:#163455;--sky:#eaf4ff;--green:#178a52;--orange:#ef8f22;--red:#b42318;--ink:#17324f;--muted:#5b7088;--line:#d9e6f2;--white:#fff;--shadow:0 18px 50px #1634551f;--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at top left,#dcefff,transparent 38%),linear-gradient(#f7fbff,#eef7ff)}button,input,select,textarea{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #1267d640;outline-offset:2px}.shell{width:min(900px,calc(100% - 24px));margin:auto;padding:18px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;padding:14px 17px;background:#fffffff0;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #16345514}.brand{font-weight:900}.small,small{color:var(--muted)}.pill,.stage{display:inline-block;padding:8px 12px;border-radius:999px;font-weight:800}.pill{background:#fff5d9}.stage{background:var(--sky);color:var(--blue);font-size:.85rem}.card{margin-bottom:18px;padding:clamp(20px,5vw,34px);background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.hero{color:#fff;background:linear-gradient(135deg,#1267d6,#4489e5)}.hero p{color:#eef7ff}h1,h2,h3{margin-top:0;line-height:1.15}h1{font-size:clamp(2rem,8vw,3.5rem)}p,li{line-height:1.6}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;font-weight:900}.buttons{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.btn{min-height:46px;padding:12px 17px;border:0;border-radius:14px;cursor:pointer;font-weight:800}.primary{color:#fff;background:var(--blue)}.success{color:#fff;background:var(--green)}.secondary{color:var(--ink);background:#eaf0f6}.danger{color:#fff;background:var(--red)}.hero .btn{color:var(--navy);background:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mini,.question,.tip,.feedback,.recorder{padding:16px;border-radius:17px}.mini{border:1px solid var(--line);background:#fafdff}.locked{opacity:.65}.question{margin:16px 0;background:#eef6ff;border-left:6px solid var(--blue)}.tip{margin:16px 0;background:#fff6df;border-left:6px solid var(--orange)}.feedback.good{margin:16px 0;background:#e8f8ef;border-left:6px solid var(--green)}.feedback.improve{margin:16px 0;background:#fff1f0;border-left:6px solid var(--red)}.field{margin:16px 0}.field label{display:block;margin-bottom:7px;font-weight:800}input,select,textarea{width:100%;padding:12px 13px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:13px}textarea{min-height:100px;resize:vertical}.progress{height:13px;margin:12px 0;background:#dfeaf4;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),#50a4ff)}.recorder{margin-top:20px;border:2px solid #c8dcf0;background:linear-gradient(#f8fcff,#eef7ff)}.rec-head{display:flex;justify-content:space-between;gap:10px}.rec-status{padding:7px 11px;border-radius:999px;background:#e7eef5;font-weight:800}.rec-status.live{color:#a21b12;background:#ffe5e2}.meter{height:11px;margin:14px 0;background:#dce8f4;border-radius:999px;overflow:hidden}.meter>div{width:0;height:100%;background:linear-gradient(90deg,var(--green),var(--orange),var(--red));transition:width .08s}.timer{font-weight:900;font-variant-numeric:tabular-nums}audio{width:100%;margin-top:12px}.checks label{display:block;margin:10px 0}.checks input{width:auto;margin-right:8px}.rubric{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.rubric .mini{border-top:5px solid var(--blue)}.band{font-size:2rem;font-weight:900;color:var(--blue)}.source-note{font-size:.88rem;color:var(--muted)}.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.topic-card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:160px;padding:18px;border:2px solid var(--line);border-radius:18px;background:#fafdff;color:var(--ink);cursor:pointer}.topic-card:hover,.topic-card:focus-visible{border-color:var(--blue);background:var(--sky)}.topic-card .stage{margin-top:auto}.prompt-card{margin:16px 0;padding:18px;border:2px solid var(--line);border-radius:18px;background:#fbfdff}.prompt-number{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border-radius:11px;background:var(--blue);color:#fff;font-weight:900}.prompt-card textarea{min-height:80px}.script-box{padding:18px;border:2px dashed #9fc3e7;border-radius:18px;background:#f7fbff}.keywords{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.keyword{padding:7px 10px;border-radius:999px;background:#eaf0f6;font-weight:700}.prep-clock{font-size:2.3rem;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}.toast{position:fixed;right:16px;bottom:16px;max-width:340px;padding:12px 16px;color:#fff;background:var(--navy);border-radius:13px;opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}[hidden]{display:none!important}@media(max-width:700px){.grid,.rubric,.topic-grid{grid-template-columns:1fr}.top{align-items:flex-start}.buttons .btn{flex:1}.card{border-radius:19px}}
  </style>
</head>
<body><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='speakFancyGitHubV1';
const questions=[
 'What do you usually do after school?',
 'What is your favourite school subject?',
 'How do you spend your weekends?',
 'Who is a person you admire?',
 'What is your favourite place in Sabah?',
 'How do you help your family at home?',
 'What activity helps you relax?',
 'What is one skill you want to learn?'
];
const stages=['plan','attempt1','revise','attempt2','result'];
const part2Stages=['topic2','plan2','attempt1','revise2','attempt2','result2'];
const part2Topics=[
 {id:'new-skill',title:'Learning a New Skill',task:'Talk about a new skill you would like to learn.',prompts:['what the skill is','how you would learn it','whether it is difficult to learn and why','why having a new skill is an advantage'],words:['skill','practise','learn','useful']},
 {id:'restaurant',title:'A Restaurant You Like',task:'Talk about a restaurant that you like to visit.',prompts:['the name of the restaurant','what you like to eat there','how often you go there','why some people prefer eating out'],words:['restaurant','dish','delicious','routine']},
 {id:'book',title:'A Book You Have Read',task:'Talk about a book that you have read.',prompts:['the name of the book','what kind of book it is','whether you like it and why','why teenagers should be encouraged to read'],words:['book','story','interesting','knowledge']},
 {id:'trip',title:'Preparing for a Trip',task:'Talk about your preparation for a trip.',prompts:['where you will go','what you will bring','who you plan to invite','whether good planning is the key to success and why'],words:['trip','prepare','invite','planning']},
 {id:'successful-person',title:'A Successful Person',task:'Talk about a successful person that you know.',prompts:['who the person is','what the person has achieved','how you know the person','why a role model can motivate us'],words:['successful','achievement','role model','motivate']},
 {id:'photograph',title:'My Favourite Photograph',task:'Talk about your favourite photograph.',prompts:['when it was taken','what is in the photograph','why it is your favourite','whether keeping memories is important and why'],words:['photograph','memory','special','remember']},
 {id:'friend',title:'A New Friend',task:'Talk about a time when you made a new friend.',prompts:['when it happened','what you like about the person','whether you often spend time together and why','why respect and trust are needed in friendship'],words:['friend','kind','trust','respect']},
 {id:'cleaning',title:'Cleaning Up at Home',task:'Talk about a time when you helped to clean your house.',prompts:['what you did','who helped you','what you kept and threw away','why recycling old items is beneficial'],words:['clean','help','recycle','environment']},
 {id:'holiday',title:'My Holiday Plan',task:'Talk about your plan for the next school holiday.',prompts:['where you plan to go','who will join you','what you will do there','how people usually feel after a holiday'],words:['holiday','travel','activity','relaxed']},
 {id:'mobile-game',title:'A Mobile Game',task:'Talk about a mobile game that you play.',prompts:['the name of the game','why you like it','who you play it with','whether mobile games improve problem-solving skills and why'],words:['game','challenge','teamwork','problem-solving']}
];
const rees={Research:'Add a simple fact or generally accepted idea.',Example:'Give a clear example.',Experience:'Share something you did, saw or felt.',Situation:'Say when, where or with whom it happens.'};
let mediaRecorder=null,stream=null,chunks=[],timerId=null,meterId=null,audioContext=null,speechRecognition=null,liveTranscript='',startedAt=0,currentAttempt=0,recorded={1:false,2:false},prepTimer=null;
const app=document.querySelector('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
const load=()=>{try{const p=JSON.parse(localStorage.getItem(KEY))||null;if(p&&!p.mode)p.mode='part1';return p}catch{return null}};
const fresh=name=>({name,mode:'part1',stage:'plan',question:questions[Math.floor(Math.random()*questions.length)],transition:'',answer:'',detailType:'Experience',detail:'',revision:'',transcript1:'',transcript2:'',tokens:0,badge:'',completed:false,assessment:null,updatedAt:new Date().toISOString()});
const freshPart2=(name,tokens=0)=>({name,mode:'part2',stage:'topic2',topicId:'',level:'basic',plans:[],revision:'',transcript1:'',transcript2:'',attempt1Recorded:false,attempt2Recorded:false,tokens,badge:'',completed:false,assessment:null,updatedAt:new Date().toISOString()});
const save=p=>{p.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(p))};
const toast=m=>{const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};
const layout=body=>`<div class="shell"><header class="top"><div><div class="brand">🗺️ Speak FANCY</div><small>SPM Speaking · ${load()?.mode==='part2'?'Part 2':'Part 1'}</small></div><span class="pill">⚡ ${load()?.tokens||0}</span></header>${body}</div>`;
function welcome(){cleanup();const p=load();app.innerHTML=layout(`<section class="card hero"><p class="eyebrow">Your speaking treasure hunt</p><h1>Find your voice.</h1><p>Plan with TAD–REES, speak twice, improve, and collect a practice badge.</p></section><section class="card"><h2>Choose your mission</h2><div class="grid"><article class="mini"><h3>Part 1</h3><p>Short interview answers using Answer + one relevant detail.</p><button class="btn primary" data-go="start-part1">${p?.mode==='part1'?'Continue':'Start'} Part 1</button></article><article class="mini"><h3>Part 2</h3><p>Plan four prompts, then deliver a one-minute individual long turn.</p><button class="btn success" data-go="start-part2">${p?.mode==='part2'?'Continue':'Start'} Part 2</button></article><article class="mini locked"><h3>Part 3</h3><p>Collaborative discussion.</p><span class="stage">Coming Soon</span></article></div></section>`)}
function askName(mode){const p=load();if(p?.name){const next=mode==='part2'?freshPart2(p.name,p.tokens||0):fresh(p.name);next.tokens=p.tokens||0;save(next);return render(next)}app.innerHTML=layout(`<section class="card"><p class="eyebrow">Create your student profile</p><h1>What should we call you?</h1><div class="field"><label for="name">Nickname</label><input id="name" maxlength="24" autocomplete="nickname" placeholder="Example: Aina"></div><input type="hidden" id="chosenMode" value="${mode}"><div id="nameError"></div><button class="btn primary" data-go="save-name">Continue →</button></section>`)}
function start(mode){const p=load();if(p&&p.mode===mode)return render(p);askName(mode)}
function nav(p){const list=p.mode==='part2'?part2Stages:stages,i=Math.max(0,list.indexOf(p.stage)),pct=Math.round(((i+1)/list.length)*100);return `<section class="card"><div class="buttons"><strong>${esc(p.name)} · Part ${p.mode==='part2'?'2':'1'} · ${pct}% complete</strong><button class="btn secondary" data-go="home">Home</button></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div style="width:${pct}%"></div></div></section>`}
function question(p){return `<div class="question"><strong>Your interview question</strong><p>${esc(p.question)}</p></div>`}
function render(p){cleanup();recorded={1:!!p.attempt1Recorded,2:!!p.attempt2Recorded};const views=p.mode==='part2'?{topic2,plan2,attempt1:part2Attempt1,revise2,attempt2:part2Attempt2,result2}:{plan,attempt1,revise,attempt2,result};app.innerHTML=layout(nav(p)+views[p.stage](p))}
function selectedTopic(p){return part2Topics.find(t=>t.id===p.topicId)||part2Topics[0]}
function topic2(p){return `<section class="card"><p class="eyebrow">Part 2 · Choose a challenge</p><h1>Pick your topic</h1><p>Each task has four SPM-style prompts. You will plan one small TAD unit for every prompt.</p><div class="field"><label for="level2">Choose your support level</label><select id="level2"><option value="basic" ${p.level==='basic'?'selected':''}>Basic · CEFR A1–A2</option><option value="intermediate" ${p.level==='intermediate'?'selected':''}>Intermediate · CEFR B1–B2</option></select></div><div class="topic-grid">${part2Topics.map(t=>`<button type="button" class="topic-card" data-topic="${t.id}"><h3>${esc(t.title)}</h3><p>${esc(t.task)}</p><span class="stage">Choose topic →</span></button>`).join('')}</div></section>`}
function taskCard(topic){return `<div class="question"><strong>${esc(topic.title)}</strong><p>${esc(topic.task)}</p><p><strong>You should say:</strong></p><ul>${topic.prompts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
function plan2(p){const t=selectedTopic(p),plans=p.plans?.length===4?p.plans:t.prompts.map(()=>({transition:'',answer:'',detailType:'Example',detail:''}));return `<section class="card"><p class="eyebrow">Part 2 · TAD–REES planning</p><h1>Answer it. Add one detail. Move on.</h1>${taskCard(t)}<div class="tip"><strong>How it works:</strong> Complete four small TAD units. Choose only one suitable REES booster for each detail. You do not need to use all four REES types.</div>${t.prompts.map((prompt,i)=>promptPlan(prompt,plans[i],i,p.level)).join('')}<div id="plan2Feedback"></div><div class="buttons"><button class="btn secondary" data-go="change-topic2">← Change Topic</button><button class="btn primary" data-go="check-plan2">Check All Four Plans →</button></div></section>`}
function promptPlan(prompt,plan,i,level){const transitions=level==='intermediate'?['First of all,','Moving on to the next point,','Furthermore,','Lastly,']:['First,','Next,','Also,','Lastly,'];return `<article class="prompt-card"><h2><span class="prompt-number">${i+1}</span>${esc(prompt)}</h2><div class="field"><label for="t2-${i}">T · Transition</label><select id="t2-${i}"><option value="">Choose one</option>${transitions.map(x=>`<option ${plan.transition===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="a2-${i}">A · Direct answer</label><textarea id="a2-${i}" placeholder="Answer this prompt directly.">${esc(plan.answer)}</textarea></div><div class="field"><label for="r2-${i}">D · REES booster</label><select id="r2-${i}">${Object.keys(rees).map(x=>`<option ${plan.detailType===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="d2-${i}">One relevant detail</label><textarea id="d2-${i}" placeholder="Add a reason, example, experience or situation.">${esc(plan.detail)}</textarea></div></article>`}
function part2Script(p){const t=selectedTopic(p),body=(p.plans||[]).map(x=>[x.transition,x.answer,x.detail].filter(Boolean).join(' ')).join(' ');return `I would like to talk about ${t.title.toLowerCase()}. ${body} That’s all for now. Thank you.`}
function scriptPanel(p,text=part2Script(p)){return `<div class="script-box"><strong>Your one-minute response</strong><p>${esc(text)}</p></div>`}
function part2Attempt1(p){const t=selectedTopic(p);return `<section class="card"><p class="eyebrow">Part 2 · Guided reading</p><h1>Record Attempt 1</h1>${taskCard(t)}${scriptPanel(p)}<div class="tip"><strong>Mode A:</strong> Read and practise. The full script stays visible to build confidence.</div>${recorder(1,'Guided Recording · up to 1 minute')}<div class="checks"><label><input type="checkbox" id="clear1"> My message was clear enough to understand.</label><label><input type="checkbox" id="detail1"> I covered all four prompts.</label></div><div id="attemptFeedback"></div><button class="btn primary" data-go="finish-attempt1">Receive Coaching →</button></section>`}
function revise2(p){const spoken=p.transcript1||part2Script(p),a=assessPart2(spoken,p,true);return `<section class="card"><p class="eyebrow">Part 2 · Mr. Wayne’s coaching</p><h1>Improve one priority</h1><div class="feedback good"><strong>What you did well</strong><p>${esc(a.strength)}</p></div><div class="feedback improve"><strong>One priority for improvement</strong><p>${esc(a.target)}</p></div><div class="tip"><strong>Guided retry:</strong> ${esc(a.retry)}</div><div class="field"><label for="revision2">Your improved one-minute response</label><textarea id="revision2" style="min-height:220px">${esc(p.revision||part2Script(p))}</textarea></div><div id="revisionFeedback"></div><button class="btn primary" data-go="save-revision2">Save Improvement →</button></section>`}
function part2Attempt2(p){const t=selectedTopic(p);return `<section class="card"><p class="eyebrow">Part 2 · Independent speaking</p><h1>20 seconds to prepare</h1>${taskCard(t)}<div class="keywords"><span class="keyword">${esc(t.title)}</span>${t.words.map(x=>`<span class="keyword">${esc(x)}</span>`).join('')}</div><div class="tip"><strong>Mode B:</strong> The full script is hidden. Use only the prompts and keywords. Speak naturally for about one minute.</div><div class="buttons"><button class="btn secondary" data-go="start-prep">Start 20-second Preparation</button><span class="prep-clock" id="prepClock">00:20</span></div>${recorder(2,'Independent Recording · up to 1 minute')}<div class="checks"><label><input type="checkbox" id="clear2"> My speech was clear and understandable.</label><label><input type="checkbox" id="natural2"> I spoke from prompts rather than reading a full script.</label><label><input type="checkbox" id="allpoints2"> I tried to cover all four prompts.</label></div><div id="attemptFeedback"></div><button class="btn success" data-go="finish-attempt2">View Practice Assessment →</button></section>`}
function result2(p){const a=p.assessment||assessPart2(p.transcript2||p.revision,p,false),total=a.grammar+a.vocabulary+a.competence+a.overall;return `<section class="card"><p class="eyebrow">Part 2 mission complete</p><h1>Your practice assessment</h1><div class="rubric">${rubricCard('Grammar',a.grammar,a.grammarText)}${rubricCard('Vocabulary',a.vocabulary,a.vocabularyText)}${rubricCard('Communicative Competence',a.competence,a.competenceText)}${rubricCard('Overall Spoken Performance',a.overall,a.overallText)}</div><div class="tip"><strong>Estimated total:</strong> ${total}/24</div><div class="feedback good"><strong>What you did well</strong><p>${esc(a.strength)}</p></div><div class="feedback improve"><strong>One priority for improvement</strong><p>${esc(a.target)}</p></div><div class="tip"><strong>Guided retry:</strong> ${esc(a.retry)}</div><p class="source-note"><strong>Important:</strong> This is an AI-generated practice estimate—not an official SPM examination mark. ${p.transcript2?'The language judgement uses the browser transcript of your independent attempt.':'Automatic transcription was unavailable, so the language judgement uses your revised response and self-check. The app does not claim to analyse pronunciation from audio alone.'}</p><div class="tip"><strong>🏅 Badge earned:</strong> ${esc(p.badge||'Long-Turn Navigator')}<br><strong>Reward:</strong> +70 tokens</div><div class="buttons"><button class="btn primary" data-go="retry2">Try Another Part 2 Topic</button><button class="btn secondary" data-go="home">Home</button></div></section>`}
function plan(p){return `<section class="card"><p class="eyebrow">Step 1 · TAD–REES planning</p><h1>Answer + One Detail</h1>${question(p)}<div class="tip"><strong>TAD:</strong> Give a direct Answer and one relevant Detail. A Transition is optional for a short Part 1 response.</div><div class="field"><label for="transition">T · Transition (optional)</label><select id="transition"><option value="">No transition</option>${['For me,','Personally,','In my opinion,'].map(x=>`<option ${p.transition===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="answer">A · Direct answer</label><textarea id="answer" placeholder="Answer the question directly in a complete sentence.">${esc(p.answer)}</textarea></div><div class="field"><label for="detailType">D · Choose one REES detail</label><select id="detailType">${Object.keys(rees).map(x=>`<option ${p.detailType===x?'selected':''}>${x}</option>`).join('')}</select><small>R = Research · E = Example · E = Experience · S = Situation. You only need one suitable detail.</small></div><div class="field"><label for="detail">One relevant detail</label><textarea id="detail" placeholder="Develop your answer with the selected REES detail.">${esc(p.detail)}</textarea></div><div id="planFeedback"></div><button class="btn primary" data-go="check-plan">Check My Plan →</button></section>`}
function response(p,text=p.revision||[p.transition,p.answer,p.detail].filter(Boolean).join(' ')){return `<div class="question"><strong>Question</strong><p>${esc(p.question)}</p><strong>Your response</strong><p>${esc(text)}</p></div>`}
function recorder(n,title){return `<div class="recorder" data-rec="${n}"><div class="rec-head"><div><h3>${title}</h3><small>Your audio stays on this device. If supported, the browser creates a transcript for practice feedback.</small></div><span class="rec-status" id="status${n}">Ready</span></div><div class="meter"><div id="meter${n}"></div></div><p class="timer" id="timer${n}">00:00</p><div class="buttons"><button class="btn danger" data-record="start" data-attempt="${n}">🎙️ Record</button><button class="btn secondary" data-record="stop" data-attempt="${n}" disabled>■ Stop</button></div><div id="audio${n}"></div><div id="transcript${n}" class="tip" hidden></div><div id="recMsg${n}" class="small"></div></div>`}
function attempt1(p){return `<section class="card"><p class="eyebrow">Step 2 · First try</p><h1>Speak clearly</h1>${response(p,[p.transition,p.answer,p.detail].filter(Boolean).join(' '))}${recorder(1,'Record Attempt 1')}<div class="checks"><label><input type="checkbox" id="clear1"> I spoke clearly enough to understand.</label><label><input type="checkbox" id="detail1"> I included my answer and detail.</label></div><div id="attemptFeedback"></div><button class="btn primary" data-go="finish-attempt1">Get Feedback →</button></section>`}
function revise(p){const spoken=p.transcript1||[p.transition,p.answer,p.detail].filter(Boolean).join(' ');const a=assess(spoken,p,true);return `<section class="card"><p class="eyebrow">Step 3 · Scale-based feedback</p><h1>Make it stronger</h1>${question(p)}<div class="feedback good"><strong>TAD–REES strength</strong><p>You gave a direct answer and developed it with ${esc(p.detailType||'one')} detail.</p></div><div class="feedback improve"><strong>Your next target</strong><p>${esc(a.target)}</p></div><p class="source-note">This formative feedback follows the Grammar, Vocabulary and Communicative Competence features in the uploaded speaking scale.</p><div class="field"><label for="revision">Improved response</label><textarea id="revision">${esc(p.revision||[p.transition,p.answer,p.detail].filter(Boolean).join(' '))}</textarea></div><div id="revisionFeedback"></div><button class="btn primary" data-go="save-revision">Save Improvement →</button></section>`}
function attempt2(p){return `<section class="card"><p class="eyebrow">Step 4 · Speak again</p><h1>Show your improvement</h1>${response(p)}${recorder(2,'Record Attempt 2')}<div class="checks"><label><input type="checkbox" id="clear2"> My voice was clear and calm.</label><label><input type="checkbox" id="natural2"> I tried to sound natural, not memorised.</label></div><div id="attemptFeedback"></div><button class="btn success" data-go="finish-attempt2">View Practice Assessment →</button></section>`}
function result(p){const a=p.assessment||assess(p.transcript2||p.revision,p,false);return `<section class="card"><p class="eyebrow">Mission complete · Practice assessment</p><h1>Well done, ${esc(p.name)}!</h1><div class="rubric">${rubricCard('Grammar',a.grammar,a.grammarText)}${rubricCard('Vocabulary',a.vocabulary,a.vocabularyText)}${rubricCard('Communicative Competence',a.competence,a.competenceText)}${rubricCard('Overall Spoken Performance',a.overall,a.overallText)}</div><div class="feedback good"><strong>What you did well</strong><p>${esc(a.strength)}</p></div><div class="feedback improve"><strong>Next target</strong><p>${esc(a.target)}</p></div><p class="source-note"><strong>Important:</strong> These are indicative practice bands (0–6), not official SPM marks. ${p.transcript2?'The language judgement uses the browser transcript of Attempt 2.':'A voice transcript was unavailable, so the language judgement uses the improved written response and learner self-check.'}</p><div class="tip"><strong>🏅 Badge earned:</strong> ${esc(p.badge||'Interview Explorer')}<br><strong>Reward:</strong> +45 tokens</div><div class="buttons"><button class="btn primary" data-go="retry">Try Another Question</button><button class="btn secondary" data-go="home">Home</button></div></section>`}
function rubricCard(label,band,text){return `<article class="mini"><h3>${label}</h3><div class="band">Band ${band}</div><p>${esc(text)}</p></article>`}
function assess(text,p,formative=false){const clean=String(text||'').trim(),wc=words(clean),lower=clean.toLowerCase(),connectors=(lower.match(/\b(and|but|because|so|also|when|where|while|although|however|for example|from my experience)\b/g)||[]).length,unique=new Set(lower.match(/[a-z']+/g)||[]).size;let grammar=wc<5?1:wc<10?2:wc<18?3:4;let vocabulary=unique<5?1:unique<9?2:unique<15?3:4;let competence=wc<5?1:wc<10?2:wc<18?3:4;if(connectors>=1){grammar=Math.min(5,grammar+1);competence=Math.min(5,competence+1)}if(unique>=20)vocabulary=5;if(wc>=28&&connectors>=2){grammar=Math.max(grammar,5);competence=Math.max(competence,5)}const overall=Math.max(1,Math.round((grammar+vocabulary+competence)/3));const strength=competence>=3?'You communicated a clear response, used TAD structure and developed one relevant REES detail.':'You communicated a basic answer on a familiar topic and completed both speaking attempts.';const target=grammar<3?'Use complete simple sentences and link them with “and”, “but” or “because”.':vocabulary<3?'Add more suitable topic words and avoid repeating the same word.':competence<3?'Develop the answer with a clearer REES example, experience or situation.':'Try a longer connected response with more precise vocabulary and a natural pace.';return{grammar,vocabulary,competence,overall,strength,target,grammarText:grammar>=5?'Good control of simple and some complex structures, with cohesive links.':grammar>=3?'Reasonable control of simple structures; some connected longer sentences.':'The meaning is understandable; strengthen control of simple sentences and connectors.',vocabularyText:vocabulary>=5?'A wide and appropriate range for this familiar topic.':vocabulary>=3?'An appropriate range for an everyday or familiar topic.':'Sufficient basic vocabulary, though some repetition may occur.',competenceText:competence>=5?'Maintains and develops the response with little difficulty.':competence>=3?'Communicates clearly and develops the familiar topic.':'Communicates basic meaning but needs more support to develop it.',overallText:overall>=5?'A longer relevant response requiring very little support.':overall>=3?'A clear response on a familiar matter with some development.':'Basic information using short, understandable language.'}}
function assessPart2(text,p,formative=false){const clean=String(text||'').trim(),wc=words(clean),lower=clean.toLowerCase(),tokens=lower.match(/[a-z']+/g)||[],unique=new Set(tokens).size,connectors=(lower.match(/\b(first|firstly|first of all|next|also|furthermore|lastly|because|so|but|however|for example|for instance|from my experience|in my opinion)\b/g)||[]).length,plans=p.plans||[],covered=plans.filter(x=>x.answer&&x.detail).length;let grammar=wc<20?1:wc<35?2:wc<55?3:wc<80?4:5,vocabulary=unique<12?1:unique<22?2:unique<32?3:unique<45?4:5,competence=covered<2?1:covered<4?2:wc<45?3:wc<75?4:5;if(connectors>=3){grammar=Math.min(5,grammar+1);competence=Math.min(5,competence+1)}if(wc>=95&&connectors>=5&&unique>=50){grammar=6;vocabulary=6;competence=6}const overall=Math.max(1,Math.min(6,Math.round((grammar+vocabulary+competence)/3))),strength=covered===4?'You organised the long turn around all four prompts and used TAD–REES to add relevant support.':'You communicated relevant ideas and began to organise them into a connected long turn.',target=covered<4?'Develop every bullet point with a direct answer and one relevant detail.':connectors<3?'Use clear transitions so the listener can follow your movement from one prompt to the next.':wc<55?'Extend the response towards one minute by adding a suitable REES detail to each point.':vocabulary<4?'Replace repeated words with more precise topic vocabulary.':'Connect your ideas naturally and reduce dependence on a memorised script.',retry=covered<4?'Choose the least developed prompt and begin: “As for this point, … because …”':connectors<3?'Try: “Moving on to the next point, …” or “Furthermore, …”':wc<55?'Add one example beginning with: “For example, …”':'Use the prompts as keywords, look away from the script, and deliver the response again.';return{grammar,vocabulary,competence,overall,strength,target,retry,grammarText:grammar>=5?'Shows good control of simple structures and some complex language across connected sentences.':grammar>=3?'Uses a range of simple structures with some longer connected sentences; errors may occur.':'Uses basic sentence patterns; errors and incomplete structures may limit control.',vocabularyText:vocabulary>=5?'Uses a wide and appropriate range of topic vocabulary with little repetition.':vocabulary>=3?'Uses an appropriate range for a familiar topic, although repetition or word-choice gaps may occur.':'Uses sufficient basic vocabulary to convey limited information.',competenceText:competence>=5?'Maintains and develops the long turn with relevant connected contributions and little support.':competence>=3?'Communicates clearly on the familiar topic and develops most prompts with some support.':'Communicates basic meaning but needs support to develop and connect the four prompts.',overallText:overall>=5?'Produces a relevant, extended long turn that is generally easy to follow.':overall>=3?'Produces a generally clear response with some connected development.':'Produces short, understandable information but does not yet sustain the long turn.'}}
function checkPlan(){const p=load(),a=document.querySelector('#answer').value.trim(),d=document.querySelector('#detail').value.trim(),t=document.querySelector('#transition').value,detailType=document.querySelector('#detailType').value,issues=[];if(words(a)<4)issues.push('Write a complete direct answer of at least four words.');if(words(d)<5)issues.push(`Add a relevant ${detailType.toLowerCase()} detail of at least five words.`);if(issues.length){document.querySelector('#planFeedback').innerHTML=`<div class="feedback improve"><strong>One more step</strong><ul>${issues.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;return}Object.assign(p,{answer:a,detail:d,detailType,transition:t,stage:'attempt1'});save(p);render(p)}
function checkPlan2(){const p=load(),plans=[],issues=[];for(let i=0;i<4;i++){const transition=document.querySelector(`#t2-${i}`).value,answer=document.querySelector(`#a2-${i}`).value.trim(),detailType=document.querySelector(`#r2-${i}`).value,detail=document.querySelector(`#d2-${i}`).value.trim();plans.push({transition,answer,detailType,detail});if(!transition)issues.push(`Prompt ${i+1}: choose a transition.`);if(words(answer)<4)issues.push(`Prompt ${i+1}: give a complete direct answer.`);if(words(detail)<5)issues.push(`Prompt ${i+1}: add one relevant ${detailType.toLowerCase()} detail.`)}if(issues.length){document.querySelector('#plan2Feedback').innerHTML=`<div class="feedback improve"><strong>Complete all four TAD units</strong><ul>${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;return}p.plans=plans;p.stage='attempt1';save(p);render(p)}
function finishAttempt(n){const p=load(),extra=p.mode==='part2'&&n===2?document.querySelector('#allpoints2')?.checked:true,ok=recorded[n]&&document.querySelector(`#clear${n}`)?.checked&&document.querySelector(n===1?'#detail1':'#natural2')?.checked&&extra;if(!ok){document.querySelector('#attemptFeedback').innerHTML='<div class="feedback improve"><strong>Complete this speaking step</strong><p>Record your response, listen to it, and tick every self-check box.</p></div>';return}p[`attempt${n}Recorded`]=true;if(p.mode==='part2'){p.stage=n===1?'revise2':'result2';if(n===2){p.completed=true;p.assessment=assessPart2(p.transcript2||p.revision,p,false);p.tokens=(Number(p.tokens)||0)+70;p.badge='Long-Turn Navigator'}}else{p.stage=n===1?'revise':'result';if(n===2){p.completed=true;p.assessment=assess(p.transcript2||p.revision,p,false);p.tokens=(Number(p.tokens)||0)+45;p.badge='Interview Explorer'}}save(p);render(p)}
function saveRevision(){const p=load(),r=document.querySelector('#revision').value.trim();if(words(r)<9){document.querySelector('#revisionFeedback').innerHTML='<div class="feedback improve"><strong>Add a little more.</strong><p>Your improved response should have at least nine words.</p></div>';return}p.revision=r;p.stage='attempt2';save(p);render(p)}
function saveRevision2(){const p=load(),r=document.querySelector('#revision2').value.trim();if(words(r)<35){document.querySelector('#revisionFeedback').innerHTML='<div class="feedback improve"><strong>Develop the long turn.</strong><p>Aim for at least 35 words across the four prompts before recording independently.</p></div>';return}p.revision=r;p.stage='attempt2';save(p);render(p)}
function startPrep(){clearInterval(prepTimer);let remaining=20;const clock=document.querySelector('#prepClock');if(!clock)return;clock.textContent='00:20';prepTimer=setInterval(()=>{remaining-=1;clock.textContent=`00:${String(Math.max(0,remaining)).padStart(2,'0')}`;if(remaining<=0){clearInterval(prepTimer);prepTimer=null;toast('Preparation time is over. Start speaking!')}},1000)}
async function beginRecording(n){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){document.querySelector(`#recMsg${n}`).textContent='Recording is not supported here. Open the published HTTPS link in Chrome, Edge, or Safari.';return}try{cleanup();stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];liveTranscript='';currentAttempt=n;const types=['audio/webm;codecs=opus','audio/webm','audio/mp4'];const type=types.find(x=>MediaRecorder.isTypeSupported(x));mediaRecorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=()=>finishRecording(n,type||mediaRecorder.mimeType);startTranscription(n);mediaRecorder.start();startedAt=Date.now();document.querySelector(`#status${n}`).textContent='Recording';document.querySelector(`#status${n}`).classList.add('live');document.querySelector(`[data-record="start"][data-attempt="${n}"]`).disabled=true;document.querySelector(`[data-record="stop"][data-attempt="${n}"]`).disabled=false;timerId=setInterval(()=>{const s=Math.floor((Date.now()-startedAt)/1000);document.querySelector(`#timer${n}`).textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;if(s>=60)stopRecording()},250);try{audioContext=new (window.AudioContext||window.webkitAudioContext)();const analyser=audioContext.createAnalyser(),source=audioContext.createMediaStreamSource(stream),data=new Uint8Array(analyser.frequencyBinCount);source.connect(analyser);const tick=()=>{if(!mediaRecorder||mediaRecorder.state!=='recording')return;analyser.getByteFrequencyData(data);document.querySelector(`#meter${n}`).style.width=Math.min(100,data.reduce((a,b)=>a+b,0)/data.length*1.5)+'%';meterId=requestAnimationFrame(tick)};tick()}catch{} }catch(e){document.querySelector(`#recMsg${n}`).textContent=e.name==='NotAllowedError'?'Microphone permission was blocked. Allow microphone access in your browser settings, then reload the page.':'The microphone could not start. Close other apps using it and try again.'}}
function startTranscription(n){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition)return;try{speechRecognition=new Recognition();speechRecognition.lang='en-MY';speechRecognition.continuous=true;speechRecognition.interimResults=true;speechRecognition.onresult=e=>{let final='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t}liveTranscript=(liveTranscript+' '+final).trim();const box=document.querySelector(`#transcript${n}`);if(box){box.hidden=false;box.innerHTML=`<strong>Live transcript</strong><p>${esc((liveTranscript+' '+interim).trim())}</p>`}};speechRecognition.onerror=()=>{};speechRecognition.start()}catch{speechRecognition=null}}
function stopRecording(){try{speechRecognition?.stop()}catch{}if(mediaRecorder?.state==='recording')mediaRecorder.stop()}
function finishRecording(n,type){clearInterval(timerId);cancelAnimationFrame(meterId);const blob=new Blob(chunks,{type:type||'audio/webm'}),url=URL.createObjectURL(blob);recorded[n]=true;const p=load();p[`transcript${n}`]=liveTranscript.trim();save(p);document.querySelector(`#status${n}`).textContent='Recorded';document.querySelector(`#status${n}`).classList.remove('live');document.querySelector(`#meter${n}`).style.width='0';document.querySelector(`#audio${n}`).innerHTML=`<audio controls src="${url}"></audio>`;const box=document.querySelector(`#transcript${n}`);if(box&&liveTranscript){box.hidden=false;box.innerHTML=`<strong>Transcript used for feedback</strong><p>${esc(liveTranscript)}</p>`}document.querySelector(`[data-record="start"][data-attempt="${n}"]`).disabled=false;document.querySelector(`[data-record="stop"][data-attempt="${n}"]`).disabled=true;document.querySelector(`#recMsg${n}`).textContent=liveTranscript?'Listen and check whether the transcript matches what you said.':'Listen to your recording. Automatic transcription is unavailable in this browser, so assessment will use your response plan and self-check.';speechRecognition=null;releaseStream();toast('Recording complete!')}
function releaseStream(){stream?.getTracks().forEach(t=>t.stop());stream=null;if(audioContext){audioContext.close().catch(()=>{});audioContext=null}}
function cleanup(){clearInterval(timerId);clearInterval(prepTimer);prepTimer=null;cancelAnimationFrame(meterId);try{speechRecognition?.abort()}catch{}speechRecognition=null;if(mediaRecorder?.state==='recording'){mediaRecorder.onstop=null;mediaRecorder.stop()}mediaRecorder=null;releaseStream()}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.record){b.dataset.record==='start'?beginRecording(Number(b.dataset.attempt)):stopRecording();return}if(b.dataset.topic){const p=load(),level=document.querySelector('#level2')?.value||'basic';p.topicId=b.dataset.topic;p.level=level;p.plans=[];p.stage='plan2';save(p);render(p);return}switch(b.dataset.go){case'home':welcome();break;case'start-part1':start('part1');break;case'start-part2':start('part2');break;case'save-name':{const n=document.querySelector('#name').value.trim(),mode=document.querySelector('#chosenMode')?.value||'part1';if(n.length<2){document.querySelector('#nameError').innerHTML='<p class="feedback improve">Please enter at least two characters.</p>';return}const p=mode==='part2'?freshPart2(n):fresh(n);save(p);render(p);break}case'change-topic2':{const p=load();p.stage='topic2';save(p);render(p);break}case'check-plan':checkPlan();break;case'check-plan2':checkPlan2();break;case'finish-attempt1':finishAttempt(1);break;case'save-revision':saveRevision();break;case'save-revision2':saveRevision2();break;case'start-prep':startPrep();break;case'finish-attempt2':finishAttempt(2);break;case'retry':{const old=load(),p=fresh(old.name);p.tokens=old.tokens;p.badge=old.badge;save(p);render(p);break}case'retry2':{const old=load(),p=freshPart2(old.name,old.tokens||0);save(p);render(p);break}}});
window.addEventListener('beforeunload',cleanup);welcome();
})();
</script></body></html>
