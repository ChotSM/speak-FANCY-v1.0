<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1267d6">
  <meta name="description" content="Speak FANCY: mobile-first SPM English speaking practice">
  <title>Speak FANCY</title>
  <style>
    :root{--blue:#1267d6;--navy:#163455;--sky:#eaf4ff;--green:#178a52;--orange:#ef8f22;--red:#b42318;--purple:#7856c8;--ink:#17324f;--muted:#5b7088;--line:#d9e6f2;--white:#fff;--shadow:0 18px 50px #1634551f;--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at top left,#dcefff,transparent 38%),linear-gradient(#f7fbff,#eef7ff)}button,input,select,textarea{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #1267d640;outline-offset:2px}.shell{width:min(900px,calc(100% - 24px));margin:auto;padding:18px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;padding:14px 17px;background:#fffffff0;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #16345514}.brand{font-weight:900}.small,small{color:var(--muted)}.pill,.stage{display:inline-block;padding:8px 12px;border-radius:999px;font-weight:800}.pill{background:#fff5d9}.stage{background:var(--sky);color:var(--blue);font-size:.85rem}.card{margin-bottom:18px;padding:clamp(20px,5vw,34px);background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.hero{color:#fff;background:linear-gradient(135deg,#1267d6,#4489e5)}.hero p{color:#eef7ff}h1,h2,h3{margin-top:0;line-height:1.15}h1{font-size:clamp(2rem,8vw,3.5rem)}p,li{line-height:1.6}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;font-weight:900}.buttons{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.btn{min-height:46px;padding:12px 17px;border:0;border-radius:14px;cursor:pointer;font-weight:800}.primary{color:#fff;background:var(--blue)}.success{color:#fff;background:var(--green)}.purple{color:#fff;background:var(--purple)}.secondary{color:var(--ink);background:#eaf0f6}.danger{color:#fff;background:var(--red)}.hero .btn{color:var(--navy);background:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mini,.question,.tip,.feedback,.recorder{padding:16px;border-radius:17px}.mini{border:1px solid var(--line);background:#fafdff}.locked{opacity:.65}.question{margin:16px 0;background:#eef6ff;border-left:6px solid var(--blue)}.tip{margin:16px 0;background:#fff6df;border-left:6px solid var(--orange)}.feedback.good{margin:16px 0;background:#e8f8ef;border-left:6px solid var(--green)}.feedback.improve{margin:16px 0;background:#fff1f0;border-left:6px solid var(--red)}.field{margin:16px 0}.field label{display:block;margin-bottom:7px;font-weight:800}input,select,textarea{width:100%;padding:12px 13px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:13px}textarea{min-height:100px;resize:vertical}.progress{height:13px;margin:12px 0;background:#dfeaf4;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),#50a4ff)}.recorder{margin-top:20px;border:2px solid #c8dcf0;background:linear-gradient(#f8fcff,#eef7ff)}.rec-head{display:flex;justify-content:space-between;gap:10px}.rec-status{padding:7px 11px;border-radius:999px;background:#e7eef5;font-weight:800}.rec-status.live{color:#a21b12;background:#ffe5e2}.meter{height:11px;margin:14px 0;background:#dce8f4;border-radius:999px;overflow:hidden}.meter>div{width:0;height:100%;background:linear-gradient(90deg,var(--green),var(--orange),var(--red));transition:width .08s}.timer{font-weight:900;font-variant-numeric:tabular-nums}audio{width:100%;margin-top:12px}.checks label{display:block;margin:10px 0}.checks input{width:auto;margin-right:8px}.rubric{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.rubric .mini{border-top:5px solid var(--blue)}.band{font-size:2rem;font-weight:900;color:var(--blue)}.source-note{font-size:.88rem;color:var(--muted)}.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.topic-card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:160px;padding:18px;border:2px solid var(--line);border-radius:18px;background:#fafdff;color:var(--ink);cursor:pointer}.topic-card:hover,.topic-card:focus-visible{border-color:var(--blue);background:var(--sky)}.topic-card .stage{margin-top:auto}.prompt-card{margin:16px 0;padding:18px;border:2px solid var(--line);border-radius:18px;background:#fbfdff}.prompt-number{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border-radius:11px;background:var(--blue);color:#fff;font-weight:900}.prompt-card textarea{min-height:80px}.criteria{margin:18px 0;padding:15px;border:1px solid var(--line);border-radius:15px;background:#f7fbff}.criteria strong{display:block;margin-bottom:9px}.criteria-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}.criterion{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:11px;transition:.2s}.criterion .mark{display:grid;flex:0 0 23px;place-items:center;width:23px;height:23px;border:2px solid #9fb1c3;border-radius:50%;font-size:.8rem;font-weight:900}.criterion.met{color:#116a40;background:#e8f8ef;border-color:#8bd0aa;font-weight:700}.criterion.met .mark{color:#fff;background:var(--green);border-color:var(--green)}.criteria-count{margin-top:9px;color:var(--muted);font-size:.88rem;font-weight:700}.criteria-count.ready{color:var(--green)}.script-box{padding:18px;border:2px dashed #9fc3e7;border-radius:18px;background:#f7fbff}.keywords{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.keyword{padding:7px 10px;border-radius:999px;background:#eaf0f6;font-weight:700}.prep-clock{font-size:2.3rem;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}.chat{display:grid;gap:12px;margin:18px 0}.bubble{max-width:86%;padding:13px 16px;border-radius:18px;line-height:1.55}.bubble.ai{justify-self:start;background:#eee8ff;border-bottom-left-radius:5px}.bubble.student{justify-self:end;color:#fff;background:var(--blue);border-bottom-right-radius:5px}.mindmap{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.mindmap span{padding:9px 12px;border:2px solid #d9cdf7;border-radius:999px;background:#f7f3ff;font-weight:700}.mindmap span.done{color:#116a40;background:#e8f8ef;border-color:#78c99d}.mindmap span.current{color:#fff;background:var(--purple);border-color:var(--purple);box-shadow:0 0 0 4px #7856c826}.mindmap span.upcoming{color:var(--muted);background:#f4f6f8;border-color:#d9e1e8}.turn-goal{padding:13px 15px;border-left:6px solid var(--purple);border-radius:14px;background:#f5f1ff}.toast{position:fixed;right:16px;bottom:16px;max-width:340px;padding:12px 16px;color:#fff;background:var(--navy);border-radius:13px;opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}[hidden]{display:none!important}@media(max-width:700px){.grid,.rubric,.topic-grid{grid-template-columns:1fr}.top{align-items:flex-start}.buttons .btn{flex:1}.card{border-radius:19px}.bubble{max-width:94%}}
  </style>
</head>
<body><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='speakFancyGitHubV1';
const PROFILES_KEY='speakFancyProfilesV1';
const ACTIVE_PROFILE_KEY='speakFancyActiveProfileV1';
const BUILD='2026.08.23-ALL5-8';
const questions=[
 'What do you usually do after school?',
 'What is your favourite school subject?',
 'How do you spend your weekends?',
 'Who is a person you admire?',
 'What is your favourite place in Sabah?',
 'How do you help your family at home?',
 'What activity helps you relax?',
 'What is one skill you want to learn?'
];
const stages=['plan','attempt1','revise','attempt2','result'];
const part2Stages=['topic2','plan2','attempt1','revise2','attempt2','result2'];
const part3Stages=['topic3','discuss3','result3'];
const part2Topics=[
 {id:'new-skill',title:'Learning a New Skill',task:'Talk about a new skill you would like to learn.',prompts:['what the skill is','how you would learn it','whether it is difficult to learn and why','why having a new skill is an advantage'],words:['skill','practise','learn','useful']},
 {id:'restaurant',title:'A Restaurant You Like',task:'Talk about a restaurant that you like to visit.',prompts:['the name of the restaurant','what you like to eat there','how often you go there','why some people prefer eating out'],words:['restaurant','dish','delicious','routine']},
 {id:'book',title:'A Book You Have Read',task:'Talk about a book that you have read.',prompts:['the name of the book','what kind of book it is','whether you like it and why','why teenagers should be encouraged to read'],words:['book','story','interesting','knowledge']},
 {id:'trip',title:'Preparing for a Trip',task:'Talk about your preparation for a trip.',prompts:['where you will go','what you will bring','who you plan to invite','whether good planning is the key to success and why'],words:['trip','prepare','invite','planning']},
 {id:'successful-person',title:'A Successful Person',task:'Talk about a successful person that you know.',prompts:['who the person is','what the person has achieved','how you know the person','why a role model can motivate us'],words:['successful','achievement','role model','motivate']},
 {id:'photograph',title:'My Favourite Photograph',task:'Talk about your favourite photograph.',prompts:['when it was taken','what is in the photograph','why it is your favourite','whether keeping memories is important and why'],words:['photograph','memory','special','remember']},
 {id:'friend',title:'A New Friend',task:'Talk about a time when you made a new friend.',prompts:['when it happened','what you like about the person','whether you often spend time together and why','why respect and trust are needed in friendship'],words:['friend','kind','trust','respect']},
 {id:'cleaning',title:'Cleaning Up at Home',task:'Talk about a time when you helped to clean your house.',prompts:['what you did','who helped you','what you kept and threw away','why recycling old items is beneficial'],words:['clean','help','recycle','environment']},
 {id:'holiday',title:'My Holiday Plan',task:'Talk about your plan for the next school holiday.',prompts:['where you plan to go','who will join you','what you will do there','how people usually feel after a holiday'],words:['holiday','travel','activity','relaxed']},
 {id:'mobile-game',title:'A Mobile Game',task:'Talk about a mobile game that you play.',prompts:['the name of the game','why you like it','who you play it with','whether mobile games improve problem-solving skills and why'],words:['game','challenge','teamwork','problem-solving']}
];
const part3Topics=[
 {id:'fashion',title:'Teenagers’ Fashion Sense',task:'factors that influence teenagers’ fashion sense',options:['friends','family','celebrities','social media','events'],follow:'In what ways can local brands change fashion trends in Malaysia?'},
 {id:'language',title:'Learning a New Language',task:'effective ways to learn a new language',options:['speaking practice','songs and films','language apps','reading','joining a club'],follow:'To what extent can speaking several languages create opportunities in life?'},
 {id:'environment',title:'A Greener School',task:'ways to make the school more environmentally friendly',options:['recycling','saving electricity','planting trees','reducing plastic','clean-up campaigns'],follow:'How can teenagers encourage their community to protect the environment?'},
 {id:'healthy',title:'A Healthy Lifestyle',task:'ways teenagers can stay healthy',options:['regular exercise','balanced meals','enough sleep','less screen time','stress management'],follow:'Which healthy habit is most difficult for teenagers to maintain?'},
 {id:'tourism',title:'Promoting Sabah Tourism',task:'ways to promote tourism in Sabah',options:['social media','cultural festivals','local food','nature activities','clean tourist sites'],follow:'How can tourism benefit local communities without harming nature?'},
 {id:'school-event',title:'A Successful School Event',task:'ways to make a school event successful',options:['good publicity','interesting activities','teamwork','clear duties','suitable prizes'],follow:'What skills can students develop by organising school events?'},
 {id:'reading',title:'Encouraging Reading',task:'ways to encourage teenagers to read more',options:['book clubs','digital books','reading challenges','interesting libraries','peer recommendations'],follow:'Do digital materials make reading more attractive to young people?'},
 {id:'community',title:'Helping the Community',task:'ways teenagers can help their local community',options:['volunteering','helping older people','fundraising','clean-up projects','tutoring children'],follow:'Why should community service be part of school life?'}
];
const rees={Research:'Add a simple fact or generally accepted idea.',Example:'Give a clear example.',Experience:'Share something you did, saw or felt.',Situation:'Say when, where or with whom it happens.'};
let mediaRecorder=null,stream=null,chunks=[],timerId=null,meterId=null,audioContext=null,speechRecognition=null,liveTranscript='',startedAt=0,currentAttempt=0,recorded={1:false,2:false},recordingFiles={},prepTimer=null;
const app=document.querySelector('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
const profileList=()=>{try{return JSON.parse(localStorage.getItem(PROFILES_KEY))||{}}catch{return {}}};
const profileId=()=>`profile-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
function migrateProfile(){const profiles=profileList();if(Object.keys(profiles).length)return profiles;try{const old=JSON.parse(localStorage.getItem(KEY));if(old?.name){old.profileId=old.profileId||profileId();profiles[old.profileId]=old;localStorage.setItem(PROFILES_KEY,JSON.stringify(profiles));localStorage.setItem(ACTIVE_PROFILE_KEY,old.profileId)}}catch{}return profiles}
const load=()=>{try{const profiles=migrateProfile(),active=localStorage.getItem(ACTIVE_PROFILE_KEY),p=profiles[active]||null;if(p&&!p.mode)p.mode='part1';return p}catch{return null}};
const fresh=name=>({name,mode:'part1',stage:'plan',question:questions[Math.floor(Math.random()*questions.length)],transition:'',answer:'',detailType:'Experience',detail:'',revision:'',transcript1:'',transcript2:'',tokens:0,badge:'',completed:false,assessment:null,updatedAt:new Date().toISOString()});
const freshPart2=(name,tokens=0)=>({name,mode:'part2',stage:'topic2',topicId:'',level:'basic',plans:[],revision:'',transcript1:'',transcript2:'',attempt1Recorded:false,attempt2Recorded:false,tokens,badge:'',completed:false,assessment:null,updatedAt:new Date().toISOString()});
const freshPart3=(name,tokens=0)=>({name,mode:'part3',stage:'topic3',topicId:'',level:'basic',turns:[],transcript3:'',tokens,badge:'',completed:false,assessment:null,updatedAt:new Date().toISOString()});
const save=p=>{const profiles=migrateProfile(),id=p.profileId||localStorage.getItem(ACTIVE_PROFILE_KEY)||profileId();p.profileId=id;p.updatedAt=new Date().toISOString();profiles[id]=p;localStorage.setItem(PROFILES_KEY,JSON.stringify(profiles));localStorage.setItem(ACTIVE_PROFILE_KEY,id);localStorage.setItem(KEY,JSON.stringify(p))};
const toast=m=>{const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};
const partLabel=p=>p?.mode==='part3'?'Part 3':p?.mode==='part2'?'Part 2':'Part 1';
const layout=body=>`<div class="shell"><header class="top"><div><div class="brand">🗺️ Speak FANCY</div><small>SPM Speaking · ${partLabel(load())} · Build ${BUILD}</small></div><span class="pill">⚡ ${load()?.tokens||0}</span></header>${body}</div>`;
function welcome(){cleanup();const p=load();app.innerHTML=layout(`<section class="card hero"><p class="eyebrow">Your speaking treasure hunt</p><h1>Find your voice.</h1><p>Plan with TAD–REES, speak, improve, interact, and collect practice badges.</p></section><section class="card"><h2>Choose your mission</h2><div class="grid"><article class="mini"><h3>Part 1</h3><p>Short interview answers using Answer + one relevant detail.</p><button class="btn primary" data-go="start-part1">${p?.mode==='part1'?'Continue':'Start'} Part 1</button></article><article class="mini"><h3>Part 2</h3><p>Plan four prompts, then deliver a one-minute individual long turn.</p><button class="btn success" data-go="start-part2">${p?.mode==='part2'?'Continue':'Start'} Part 2</button></article><article class="mini"><h3>Part 3</h3><p>Take turns with an AI partner, negotiate and reach a decision.</p><button class="btn purple" data-go="start-part3">${p?.mode==='part3'?'Continue':'Start'} Part 3</button></article></div><div class="tip"><strong>Is a different learner using this device?</strong><p>Create a separate profile so every learner keeps their own progress, tokens and badges.</p><div class="buttons"><button class="btn primary" data-go="new-user">＋ Create New User</button><button class="btn secondary" data-go="users">👤 View Saved Users</button></div></div></section>`)}
function askName(mode){const p=load();if(p?.name){const next=mode==='part3'?freshPart3(p.name,p.tokens||0):mode==='part2'?freshPart2(p.name,p.tokens||0):fresh(p.name);next.tokens=p.tokens||0;save(next);return render(next)}app.innerHTML=layout(`<section class="card"><p class="eyebrow">Create your student profile</p><h1>What should we call you?</h1><div class="field"><label for="name">Nickname</label><input id="name" maxlength="24" autocomplete="nickname" placeholder="Example: Aina"></div><input type="hidden" id="chosenMode" value="${mode}"><div id="nameError"></div><button class="btn primary" data-go="save-name">Continue →</button></section>`)}
function start(mode){const p=load();if(p&&p.mode===mode)return render(p);askName(mode)}
function nav(p){const list=p.mode==='part3'?part3Stages:p.mode==='part2'?part2Stages:stages,i=Math.max(0,list.indexOf(p.stage)),pct=p.mode==='part3'&&p.stage==='discuss3'?Math.round(((1+(p.turns?.length||0)/5)/3)*100):Math.round(((i+1)/list.length)*100),canGoBack=i>0&&!p.stage.startsWith('result');return `<section class="card"><div class="buttons"><strong>${esc(p.name)} · ${partLabel(p)} · ${pct}% complete</strong>${canGoBack?'<button class="btn secondary" data-go="back">← Back</button>':''}<button class="btn secondary" data-go="home">🏠 Home</button><button class="btn secondary" data-go="users">👤 Users</button></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div style="width:${pct}%"></div></div></section>`}
function goBack(){const p=load();if(!p)return welcome();const list=p.mode==='part3'?part3Stages:p.mode==='part2'?part2Stages:stages,i=list.indexOf(p.stage);if(i<=0||p.stage.startsWith('result'))return;const revision=document.querySelector(p.mode==='part2'?'#revision2':'#revision');if(revision&&revision.value.trim())p.revision=revision.value.trim();p.stage=list[i-1];save(p);render(p);window.scrollTo({top:0,behavior:'smooth'})}
function users(){cleanup();const profiles=Object.values(migrateProfile()),active=localStorage.getItem(ACTIVE_PROFILE_KEY);app.innerHTML=layout(`<section class="card"><p class="eyebrow">Learner profiles</p><h1>Who is practising?</h1><p>Choose a saved learner or create a new profile. Each learner keeps separate progress, tokens and badges.</p><div class="topic-grid">${profiles.map(p=>`<button type="button" class="topic-card" data-profile="${esc(p.profileId)}"><h3>${p.profileId===active?'⭐ ':''}${esc(p.name)}</h3><p>${esc(partLabel(p))} · ${Number(p.tokens)||0} tokens</p><span class="stage">${p.profileId===active?'Current user':'Switch to this user'} →</span></button>`).join('')}</div><div class="buttons" style="margin-top:18px"><button class="btn primary" data-go="new-user">＋ Create New User</button><button class="btn secondary" data-go="cancel-users">Cancel</button></div></section>`)}
function newUser(){app.innerHTML=layout(`<section class="card"><p class="eyebrow">New learner</p><h1>Create your profile</h1><p>Enter a nickname. Your profile will be kept separate from other learners on this device.</p><div class="field"><label for="newUserName">Nickname</label><input id="newUserName" maxlength="24" autocomplete="nickname" placeholder="Example: Aina"></div><div id="newUserError" aria-live="polite"></div><div class="buttons"><button class="btn primary" data-go="create-user">Create Profile</button><button class="btn secondary" data-go="users">Back</button></div></section>`);document.querySelector('#newUserName')?.focus()}
function createUser(){const input=document.querySelector('#newUserName'),name=input?.value.trim()||'',error=document.querySelector('#newUserError'),profiles=Object.values(profileList());if(name.length<2){error.innerHTML='<div class="feedback improve"><strong>Nickname is too short.</strong><p>Please enter at least two characters.</p></div>';input?.focus();return}if(profiles.some(p=>String(p.name).toLowerCase()===name.toLowerCase())){error.innerHTML='<div class="feedback improve"><strong>This nickname already exists.</strong><p>Choose that saved user or enter a different nickname.</p></div>';input?.focus();return}const p=fresh(name);p.profileId=profileId();save(p);toast('New profile created!');welcome()}
function switchUser(id){const p=profileList()[id];if(!p)return users();localStorage.setItem(ACTIVE_PROFILE_KEY,id);localStorage.setItem(KEY,JSON.stringify(p));toast(`Welcome, ${p.name}!`);welcome()}
function question(p){return `<div class="question"><strong>Your interview question</strong><p>${esc(p.question)}</p></div>`}
function render(p){cleanup();recorded={1:!!p.attempt1Recorded,2:!!p.attempt2Recorded,3:false};const views=p.mode==='part3'?{topic3,discuss3,result3}:p.mode==='part2'?{topic2,plan2,attempt1:part2Attempt1,revise2,attempt2:part2Attempt2,result2}:{plan,attempt1,revise,attempt2,result};app.innerHTML=layout(nav(p)+views[p.stage](p));if(p.mode==='part2'&&p.stage==='plan2'){updateAllPromptChecklists2();bindPlan2ActionButtons()}}
function selectedTopic(p){return part2Topics.find(t=>t.id===p.topicId)||part2Topics[0]}
function topic2(p){return `<section class="card"><p class="eyebrow">Part 2 · Choose a challenge</p><h1>Pick your topic</h1><p>Each task has four SPM-style prompts. You will plan one small TAD unit for every prompt.</p><div class="field"><label for="level2">Choose your support level</label><select id="level2"><option value="basic" ${p.level==='basic'?'selected':''}>Basic · CEFR A1–A2</option><option value="intermediate" ${p.level==='intermediate'?'selected':''}>Intermediate · CEFR B1–B2</option></select></div><div class="topic-grid">${part2Topics.map(t=>`<button type="button" class="topic-card" data-topic="${t.id}"><h3>${esc(t.title)}</h3><p>${esc(t.task)}</p><span class="stage">Choose topic →</span></button>`).join('')}</div></section>`}
function taskCard(topic){return `<div class="question"><strong>${esc(topic.title)}</strong><p>${esc(topic.task)}</p><p><strong>You should say:</strong></p><ul>${topic.prompts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
function plan2(p){const t=selectedTopic(p),plans=p.plans?.length===4?p.plans:t.prompts.map(()=>({transition:'',answer:'',detailType:'Example',detail:''}));return `<section class="card"><p class="eyebrow">Part 2 · TAD–REES planning</p><h1>Answer it. Add one detail. Move on.</h1>${taskCard(t)}<div class="tip"><strong>How it works:</strong> Complete one small TAD unit, receive feedback, and then move to the next prompt. Choose only one suitable REES booster for each detail. Each transition can be used only once.</div>${t.prompts.map((prompt,i)=>promptPlan(prompt,plans[i],i,p.level,plans)).join('')}<div id="plan2Feedback"></div><div class="buttons"><button class="btn secondary" data-go="change-topic2">← Change Topic</button><button class="btn primary" data-go="check-plan2">Combine My Four Answers →</button></div></section>`}
function bindPlan2ActionButtons(){const actions=[['check-plan2',()=>{toast('Combining your four answers…');checkPlan2()}],['continue-plan2-preview',()=>{toast('Opening your combined script…');continuePlan2()}],['continue-plan2-record',()=>{toast('Opening Guided Recording…');continuePlan2(true)}]];actions.forEach(([name,action])=>{const button=document.querySelector(`[data-go="${name}"]`);if(!button||button.dataset.directBound==='yes')return;button.dataset.directBound='yes';button.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();action()})})}
const transitionGroups2=[

function aiTurn(p){const t=selectedTopic3(p),n=Math.min(p.turns.length,t.options.length-1),option=t.options[n],lastTurn=p.turns[n-1],last=typeof lastTurn==='string'?lastTurn:(lastTurn?.student||'');if(n===0)return `Hi, ${p.name}. We need to discuss all five ideas, one by one. Let’s begin with ${option}. I think it works well because ${aiReason(option,n)}. What do you think? Do you agree with me?`;const previous=t.options[n-1],response=/disagree|however|not agree/i.test(last)?`That’s a fair point about ${previous}. I can see why you disagree.`:`Yes, I agree with what you said about ${previous}.`;if(n===t.options.length-1)return `${response} We have now reached our fifth and final idea: ${option}. I think it matters because ${aiReason(option,n)}. Do you agree? After discussing it, let’s choose our best idea and close the discussion.`;return `${response} We have discussed ${n} of the five ideas. Now, let’s move to ${option}. I think it could help because ${aiReason(option,n)}. How about you? Do you agree, or do you see it differently?`}
function youngFemaleVoices(voices){const usable=voices.filter(v=>/^en(?:-|_)/i.test(v.lang)&&!/(compact|espeak|festival|robot|daniel|david|mark|george|male)/i.test(v.name)),patterns=[/ava.*natural/i,/aria.*natural/i,/zoe/i,/siri.*female/i,/google.*us.*female/i,/google.*uk.*female/i,/libby.*natural/i,/jenny.*natural/i,/allison/i,/karen/i,/samantha/i,/sonia/i,/serena/i,/moira/i];return usable.sort((a,b)=>{const rank=v=>{const i=patterns.findIndex(p=>p.test(v.name));return i<0?99:i};return rank(a)-rank(b)})}

function turnGuide(p){const n=Math.min(p.turns.length,4),level=p.level,t=selectedTopic3(p),option=t.options[n];if(n===4)return [`Agree or disagree with the AI’s opinion on “${option}”, add your own opinion, then negotiate and close`,level==='basic'?`I agree/disagree about ${option} because … I think the best choice is … So, we agree that … Thank you.`:`I agree/disagree with your view on ${option} because … Overall, I would choose … as the most effective. Can we agree on that? Thank you for the discussion.`];return [`Agree or disagree with the AI’s opinion on “${option}”, then give and develop your own opinion`,level==='basic'?`I agree/disagree with you about ${option} because … I also think …`:`I agree/disagree with your point about ${option} because … In my opinion, …`]}

function buildTurn3FromTadRees(){const transition=document.querySelector('#t3Transition')?.value.trim()||'',answer=document.querySelector('#t3Answer')?.value.trim()||'',type=document.querySelector('#t3Rees')?.value||'Example',detail=document.querySelector('#t3Detail')?.value.trim()||'',close=document.querySelector('#t3Close')?.value.trim()||'',feedback=document.querySelector('#tadRees3Feedback'),missing=[];if(!transition)missing.push('choose a Transition that agrees or disagrees politely');if(words(answer)<4)missing.push('give a complete direct Answer or opinion');if(words(detail)<4)missing.push(`add one developed ${type} Detail`);if(document.querySelector('#t3Close')&&words(close)<5)missing.push('negotiate the best choice and close the discussion');if(missing.length){feedback.innerHTML=`<div class="feedback improve"><strong>Complete your TAD–REES turn</strong><ul>${missing.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;return}const answerText=/\b(i think|i believe|in my opinion|for me|my view|i feel)\b/i.test(answer)?answer:`In my opinion, ${answer.charAt(0).toLowerCase()+answer.slice(1)}`,starters={Research:'According to research,',Example:'For example,',Experience:'From my experience,',Situation:'In this situation,'},detailText=new RegExp(`^${starters[type].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}`,'i').test(detail)?detail:`${starters[type]} ${detail.charAt(0).toLowerCase()+detail.slice(1)}`,turn=[tidySentence2(transition),tidySentence2(answerText),tidySentence2(detailText),tidySentence2(close)].filter(Boolean).join(' '),box=document.querySelector('#turn3');box.value=turn;feedback.innerHTML=`<div class="feedback good"><strong>TAD–REES turn ready ✓</strong><p>Your Transition, Answer and ${type} Detail have been combined below. You may edit the complete turn before recording or sending it.</p></div>`;box.focus();toast('Your TAD–REES discussion turn is ready!')}

function assessPart3(p){const text=p.turns.map(x=>x.student).join(' '),lower=text.toLowerCase(),wc=words(text),unique=new Set(lower.match(/[a-z']+/g)||[]).size,agree=(lower.match(/\b(agree|disagree|understand your point|you are right|however)\b/g)||[]).length,questions=(text.match(/\?/g)||[]).length,develop=(lower.match(/\b(because|for example|for instance|from my experience|this means|therefore|so)\b/g)||[]).length,negotiate=(lower.match(/\b(best|most effective|decide|agree that|final decision|choose)\b/g)||[]).length,closure=(lower.match(/\b(in conclusion|to conclude|we agree|thank you|that is our decision)\b/g)||[]).length;let grammar=wc<35?2:wc<60?3:wc<90?4:5,vocabulary=unique<20?2:unique<32?3:unique<45?4:5,competence=2;competence+=agree>0?1:0;competence+=questions>0?1:0;competence+=develop>1?1:0;competence+=negotiate>0&&closure>0?1:0;if(wc>=120&&develop>=4)grammar=6;if(unique>=60)vocabulary=6;const overall=Math.max(1,Math.min(6,Math.round((grammar+vocabulary+competence)/3))),strength=competence>=5?'You responded to your partner, developed ideas, asked a follow-up question, negotiated and closed the discussion collaboratively.':'You maintained the discussion across five turns and communicated relevant ideas.',target=questions===0?'Ask a relevant follow-up question to invite your partner to develop an idea.':agree===0?'Respond directly by agreeing or disagreeing politely before adding your own point.':develop<2?'Develop more ideas with research, an example, an experience or a situation.':negotiate===0?'Compare the options and clearly negotiate which one is the best.':closure===0?'End by stating the shared decision and closing naturally.':'Use a wider range of natural interaction phrases and respond more precisely to the previous idea.',retry=target;return{grammar,vocabulary,competence,overall,strength,target,retry,grammarText:grammar>=5?'Uses a good range of simple and some complex structures to express and connect ideas.':grammar>=3?'Uses simple structures with function checkPlan2(){const p=load(),topic=selectedTopic(p),plans=[],required=[],advice=[];for(let i=0;i<4;i++){const transition=document.querySelector(`#t2-${i}`).value,answer=document.querySelector(`#a2-${i}`).value.trim(),detailType=document.querySelector(`#r2-${i}`).value,detail=document.querySelector(`#d2-${i}`).value.trim(),plan={transition,answer,detailType,detail};plans.push(plan);if(!transition)required.push(`Prompt ${i+1}: choose a suitable transition.`);if(words(answer)<3)required.push(`Prompt ${i+1}: give a complete, direct answer.`);if(words(detail)<4)required.push(`Prompt ${i+1}: add one relevant ${detailType.toLowerCase()} detail.`);if(answer&&detail){const check=promptQuality(plan,topic.prompts[i],i),q=check.q;if(!check.direct)advice.push(`Prompt ${i+1}: make the answer direct and complete.`);if(answer.toLowerCase()===detail.toLowerCase())advice.push(`Prompt ${i+1}: the detail repeats the answer instead of developing it.`);if(!check.reesFit)advice.push(`Prompt ${i+1}: check whether the detail clearly matches ${detailType}. ${rees[detailType]}`);if(q.mixedLanguage)advice.push(`Prompt ${i+1}: use English throughout; replace the non-English expression.`);if(q.contradiction)advice.push(`Prompt ${i+1}: check that the ideas are logically consistent.`);if(q.unsupportedResearch)advice.push(`Prompt ${i+1}: name a credible source for the Research claim, or choose another REES type.`);if(q.vaguePronoun)advice.push(`Prompt ${i+1}: replace an unclear pronoun such as “it” or “this” with the exact idea.`);if(q.fragments.length)advice.push(`Prompt ${i+1}: check for an incomplete sentence or missing sentence boundary.`)}}p.plans=plans;save(p);const panel=document.querySelector('#plan2Feedback');if(required.length){panel.innerHTML=`<div class="feedback improve"><strong>Complete these required parts</strong><p>These fields are still incomplete:</p><ul>${required.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;return}if(advice.length){panel.innerHTML=`<div class="feedback improve"><strong>Teacher’s quality check</strong><p>Please review these possible concerns. The automated checker may occasionally misread a valid sentence, so these are guidance—not a permanent lock.</p><ul>${advice.slice(0,10).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>Make any useful correction above, then check again, or continue if your meaning is already clear.</p><button class="btn success" type="button" data-go="continue-plan2-preview">Save Plans and Continue →</button></div>`;panel.scrollIntoView({behavior:'smooth',block:'center'});return}continuePlan2()}
function continuePlan2(confirmed=false){const p=load();if(!p?.plans||p.plans.length!==4){toast('Please complete all four prompts first.');return}if(!confirmed){const panel=document.querySelector('#plan2Feedback');if(!panel){toast('The combined-script panel could not be opened. Please refresh once.');return}panel.innerHTML=`<div class="feedback good"><strong>Excellent—you completed all four prompts!</strong><p>Your answers have now been combined into one connected Part 2 response.</p></div><div class="script-box"><strong>Your Combined Speaking Script</strong><p>${esc(part2Script(p))}</p></div><div class="tip"><strong>Before recording:</strong> Read the complete script once. Check that every idea expresses your intended meaning. You may return to any prompt above and edit it before continuing.</div><button class="btn success" type="button" data-go="continue-plan2-record">Use This Script for Guided Recording →</button>`;bindPlan2ActionButtons();panel.scrollIntoView({behavior:'smooth',block:'start'});return}p.stage='attempt1';save(p);render(p);window.scrollTo({top:0,behavior:'smooth'})}
function finishAttempt(n){const p=load(),extra=p.mode==='part2'&&n===2?document.querySelector('#allpoints2')?.checked:true,choiceOk=recordingFiles[n]?.decision,ok=recorded[n]&&choiceOk&&document.querySelector(`#clear${n}`)?.checked&&document.querySelector(n===1?'#detail1':'#natural2')?.checked&&extra;if(!ok){document.querySelector('#attemptFeedback').innerHTML=`<div class="feedback improve"><strong>Complete this speaking step</strong><p>${recorded[n]&&!choiceOk?'Choose “Download Recording” or “Do Not Save” before continuing.':'Record your response, listen to it, choose whether to save it, and tick every self-check box.'}</p></div>`;return}p[`attempt${n}Recorded`]=true;if(p.mode==='part2'){p.stage=n===1?'revise2':'result2';if(n===2){p.completed=true;p.assessment=assessPart2(p.transcript2||p.revision,p,false);p.tokens=(Number(p.tokens)||0)+70;p.badge='Long-Turn Navigator'}}else{p.stage=n===1?'revise':'result';if(n===2){p.completed=true;p.assessment=assess(p.transcript2||p.revision,p,false);p.tokens=(Number(p.tokens)||0)+45;p.badge='Interview Explorer'}}save(p);render(p)}
function saveRevision(){const p=load(),r=document.querySelector('#revision').value.trim();if(words(r)<9){document.querySelector('#revisionFeedback').innerHTML='<div class="feedback improve"><strong>Add a little more.</strong><p>Your improved response should have at least nine words.</p></div>';return}p.revision=r;p.stage='attempt2';save(p);render(p)}
function saveRevision2(){const p=load(),box=document.querySelector('#revision2'),feedback=document.querySelector('#revisionFeedback'),r=box?.value.trim()||'',q=qualitySignals(r),old=String(p.transcript1||part2Script(p)||'').trim(),blocking=[];if(words(r)<20)blocking.push('Develop the response to at least 20 words so the main ideas can be assessed.');if(r===old)blocking.push('The response has not been revised yet. Make at least one meaningful correction before continuing.');if(q.mixedLanguage)blocking.push('Use English throughout; replace every Malay expression with clear English.');if(q.contradiction)blocking.push('Correct the inconsistent ideas, such as saying that you are alone and also with friends.');if(q.unsupportedResearch)blocking.push('Name a credible source for the Research claim, or change it to Example, Experience or Situation.');if(q.fragments.length>=2)blocking.push('Complete the unfinished sentences and add clear sentence boundaries.');if(q.runOns.length>=2)blocking.push('Divide the overloaded sentences into shorter, controlled sentences.');if(blocking.length){feedback.innerHTML=`<div class="feedback improve"><strong>Your correction has been checked.</strong><p>Please fix ${blocking.length===1?'this point':'these points'} before independent speaking:</p><ul>${blocking.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><strong>Your revised text is saved in this box.</strong> Correct it here, then click the button again.</p></div>`;box.focus();return}p.revision=r;p.stage='attempt2';save(p);render(p)}
function useTranscript3(){const p=load(),box=document.querySelector('#turn3');if(!box)return;if(p.transcript3){box.value=p.transcript3;toast('Voice transcript added to your turn.')}else{document.querySelector('#turn3Feedback').innerHTML='<div class="feedback improve"><strong>No transcript found</strong><p>Record this turn first, or type your response. Some browsers can record audio but cannot create a transcript.</p></div>'}}
function sendTurn3(){const p=load(),student=document.querySelector('#turn3')?.value.trim()||'',n=p.turns.length,lower=student.toLowerCase(),topic=selectedTopic3(p),option=topic.options[Math.min(n,topic.options.length-1)],issues=[];if(recorded[3]&&!recordingFiles[3]?.decision)issues.push('Choose “Download Recording” or “Do Not Save” before sending this turn.');if(words(student)<8)issues.push('Give a complete contribution of at least eight words.');if(!/agree|disagree|i see your point|i understand your point|you are right|however/.test(lower))issues.push('Clearly agree or disagree with the AI partner’s opinion.');if(!/i think|i believe|in my opinion|for me|my view|i feel/.test(lower))issues.push(`Give your own opinion about “${option}”.`);if(!/because|for example|for instance|from my experience|this means|so|research|study|when|if/.test(lower))issues.push('Develop your opinion with a reason or a suitable TAD–REES detail.');if(n===4&&!/best|most effective|choose|decision|conclusion|finally|we agree|thank/.test(lower))issues.push('Suggest the best final choice and close the discussion naturally.');if(issues.length){document.querySelector('#turn3Feedback').innerHTML=`<div class="feedback improve"><strong>Strengthen this turn</strong><ul>${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;return}p.turns.push({ai:aiTurn(p),student,spoken:!!p.transcript3,prompt:option});p.transcript3='';if(p.turns.length>=5){p.stage='result3';p.completed=true;p.assessment=assessPart3(p);p.tokens=(Number(p.tokens)||0)+90;p.badge='Discussion Diplomat'}save(p);render(p)}
function startPrep(){clearInterval(prepTimer);let remaining=20;const clock=document.querySelector('#prepClock');if(!clock)return;clock.textContent='00:20';prepTimer=setInterval(()=>{remaining-=1;clock.textContent=`00:${String(Math.max(0,remaining)).padStart(2,'0')}`;if(remaining<=0){clearInterval(prepTimer);prepTimer=null;toast('Preparation time is over. Start speaking!')}},1000)}
async function beginRecording(n){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){document.querySelector(`#recMsg${n}`).textContent='Recording is not supported here. Open the published HTTPS link in Chrome, Edge, or Safari.';return}try{cleanup();discardRecordingFile(n,false);stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];liveTranscript='';currentAttempt=n;const types=['audio/mp4','audio/webm;codecs=opus','audio/webm'];const type=types.find(x=>MediaRecorder.isTypeSupported(x));mediaRecorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=()=>finishRecording(n,type||mediaRecorder.mimeType);startTranscription(n);mediaRecorder.start();startedAt=Date.now();document.querySelector(`#status${n}`).textContent='Recording';document.querySelector(`#status${n}`).classList.add('live');document.querySelector(`[data-record="start"][data-attempt="${n}"]`).disabled=true;document.querySelector(`[data-record="stop"][data-attempt="${n}"]`).disabled=false;timerId=setInterval(()=>{const s=Math.floor((Date.now()-startedAt)/1000);document.querySelector(`#timer${n}`).textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;if(s>=60)stopRecording()},250);try{audioContext=new (window.AudioContext||window.webkitAudioContext)();const analyser=audioContext.createAnalyser(),source=audioContext.createMediaStreamSource(stream),data=new Uint8Array(analyser.frequencyBinCount);source.connect(analyser);const tick=()=>{if(!mediaRecorder||mediaRecorder.state!=='recording')return;analyser.getByteFrequencyData(data);document.querySelector(`#meter${n}`).style.width=Math.min(100,data.reduce((a,b)=>a+b,0)/data.length*1.5)+'%';meterId=requestAnimationFrame(tick)};tick()}catch{} }catch(e){document.querySelector(`#recMsg${n}`).textContent=e.name==='NotAllowedError'?'Microphone permission was blocked. Allow microphone access in your browser settings, then reload the page.':'The microphone could not start. Close other apps using it and try again.'}}
function startTranscription(n){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition)return;try{speechRecognition=new Recognition();speechRecognition.lang='en-MY';speechRecognition.continuous=true;speechRecognition.interimResults=true;speechRecognition.onresult=e=>{let final='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t}liveTranscript=(liveTranscript+' '+final).trim();const box=document.querySelector(`#transcript${n}`);if(box){box.hidden=false;box.innerHTML=`<strong>Live transcript</strong><p>${esc((liveTranscript+' '+interim).trim())}</p>`}};speechRecognition.onerror=()=>{};speechRecognition.start()}catch{speechRecognition=null}}
function stopRecording(){try{speechRecognition?.stop()}catch{}if(mediaRecorder?.state==='recording')mediaRecorder.stop()}
function finishRecording(n,type){clearInterval(timerId);cancelAnimationFrame(meterId);const mime=type||'audio/webm',blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob);recordingFiles[n]={blob,url,mime,decision:''};recorded[n]=true;const p=load();p[`transcript${n}`]=liveTranscript.trim();save(p);document.querySelector(`#status${n}`).textContent='Recorded';document.querySelector(`#status${n}`).classList.remove('live');document.querySelector(`#meter${n}`).style.width='0';document.querySelector(`#audio${n}`).innerHTML=`<audio controls src="${url}"></audio>`;document.querySelector(`#recordChoice${n}`).hidden=false;const box=document.querySelector(`#transcript${n}`);if(box&&liveTranscript){box.hidden=false;box.innerHTML=`<strong>Transcript used for feedback</strong><p>${esc(liveTranscript)}</p>`}document.querySelector(`[data-record="start"][data-attempt="${n}"]`).disabled=false;document.querySelector(`[data-record="stop"][data-attempt="${n}"]`).disabled=true;document.querySelector(`#recMsg${n}`).textContent=liveTranscript?'Listen and check whether the transcript matches what you said. Then choose whether to download or discard it.':'Listen to your recording. Then choose whether to download or discard it. Automatic transcription is unavailable, so assessment will use your response plan and self-check.';speechRecognition=null;releaseStream();toast('Recording complete—choose whether to save it.')}
function recordingFilename(n,mime){const p=load(),safe=String(p?.name||'learner').trim().replace(/[^a-z0-9_-]+/gi,'-').replace(/^-+|-+$/g,'')||'learner',part=p?.mode==='part3'?'part3-turn-'+((p.turns?.length||0)+1):p?.mode==='part2'?'part2-attempt-'+n:'part1-attempt-'+n,ext=/mp4/i.test(mime)?'mp4':'webm';return `Speak-FANCY-${safe}-${part}.${ext}`}
function downloadRecording(n){const file=recordingFiles[n];if(!file?.blob)return;const link=document.createElement('a');link.href=file.url;link.download=recordingFilename(n,file.mime);document.body.appendChild(link);link.click();link.remove();file.decision='downloaded';const msg=document.querySelector(`#recordChoiceMsg${n}`);if(msg)msg.textContent=`Downloaded as ${link.download}. You may now send the file to your teacher.`;toast('Recording downloaded to this device!')}
function discardRecordingFile(n,showMessage=true){const file=recordingFiles[n];if(file?.url)URL.revokeObjectURL(file.url);if(file)file.decision='discarded';const audio=document.querySelector(`#audio${n}`);if(audio)audio.innerHTML='';const msg=document.querySelector(`#recordChoiceMsg${n}`);if(msg&&showMessage)msg.textContent='Recording not saved. It has been removed from this page.';if(showMessage)toast('Recording removed—not saved.')}
function releaseStream(){stream?.getTracks().forEach(t=>t.stop());stream=null;if(audioContext){audioContext.close().catch(()=>{});audioContext=null}}
function cleanup(){clearInterval(timerId);clearInterval(prepTimer);prepTimer=null;cancelAnimationFrame(meterId);try{speechRecognition?.abort()}catch{}speechRecognition=null;try{window.speechSynthesis?.cancel()}catch{}if(mediaRecorder?.state==='recording'){mediaRecorder.onstop=null;mediaRecorder.stop()}mediaRecorder=null;releaseStream()}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.profile){e.stopImmediatePropagation();switchUser(b.dataset.profile);return}switch(b.dataset.go){case'users':e.stopImmediatePropagation();users();break;case'new-user':e.stopImmediatePropagation();newUser();break;case'create-user':e.stopImmediatePropagation();createUser();break;case'cancel-users':e.stopImmediatePropagation();render(load());break}});

;render(p);break}case'retry2':{const old=load(),p=freshPart2(old.name,old.tokens||0);save(p);render(p);break}case'retry3':{const old=load(),p=freshPart3(old.name,old.tokens||0);save(p);render(p);break}}});
window.addEventListener('beforeunload',cleanup);welcome();
})();
