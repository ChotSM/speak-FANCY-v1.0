<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1267d6">
  <meta name="description" content="Speak FANCY: mobile-first SPM English speaking practice">
  <title>Speak FANCY</title>
  <style>
    :root{--blue:#1267d6;--navy:#163455;--sky:#eaf4ff;--green:#178a52;--orange:#ef8f22;--red:#b42318;--ink:#17324f;--muted:#5b7088;--line:#d9e6f2;--white:#fff;--shadow:0 18px 50px #1634551f;--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at top left,#dcefff,transparent 38%),linear-gradient(#f7fbff,#eef7ff)}button,input,select,textarea{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #1267d640;outline-offset:2px}.shell{width:min(850px,calc(100% - 24px));margin:auto;padding:18px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;padding:14px 17px;background:#fffffff0;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #16345514}.brand{font-weight:900}.small,small{color:var(--muted)}.pill,.stage{display:inline-block;padding:8px 12px;border-radius:999px;font-weight:800}.pill{background:#fff5d9}.stage{background:var(--sky);color:var(--blue);font-size:.85rem}.card{margin-bottom:18px;padding:clamp(20px,5vw,34px);background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.hero{color:#fff;background:linear-gradient(135deg,#1267d6,#4489e5)}.hero p{color:#eef7ff}h1,h2,h3{margin-top:0;line-height:1.15}h1{font-size:clamp(2rem,8vw,3.5rem)}p,li{line-height:1.6}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;font-weight:900}.buttons{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.btn{min-height:46px;padding:12px 17px;border:0;border-radius:14px;cursor:pointer;font-weight:800}.primary{color:#fff;background:var(--blue)}.success{color:#fff;background:var(--green)}.secondary{color:var(--ink);background:#eaf0f6}.danger{color:#fff;background:var(--red)}.hero .btn{color:var(--navy);background:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mini,.question,.tip,.feedback,.recorder{padding:16px;border-radius:17px}.mini{border:1px solid var(--line);background:#fafdff}.locked{opacity:.65}.question{margin:16px 0;background:#eef6ff;border-left:6px solid var(--blue)}.tip{margin:16px 0;background:#fff6df;border-left:6px solid var(--orange)}.feedback.good{margin:16px 0;background:#e8f8ef;border-left:6px solid var(--green)}.feedback.improve{margin:16px 0;background:#fff1f0;border-left:6px solid var(--red)}.field{margin:16px 0}.field label{display:block;margin-bottom:7px;font-weight:800}input,select,textarea{width:100%;padding:12px 13px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:13px}textarea{min-height:100px;resize:vertical}.progress{height:13px;margin:12px 0;background:#dfeaf4;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),#50a4ff)}.recorder{margin-top:20px;border:2px solid #c8dcf0;background:linear-gradient(#f8fcff,#eef7ff)}.rec-head{display:flex;justify-content:space-between;gap:10px}.rec-status{padding:7px 11px;border-radius:999px;background:#e7eef5;font-weight:800}.rec-status.live{color:#a21b12;background:#ffe5e2}.meter{height:11px;margin:14px 0;background:#dce8f4;border-radius:999px;overflow:hidden}.meter>div{width:0;height:100%;background:linear-gradient(90deg,var(--green),var(--orange),var(--red));transition:width .08s}.timer{font-weight:900;font-variant-numeric:tabular-nums}audio{width:100%;margin-top:12px}.checks label{display:block;margin:10px 0}.checks input{width:auto;margin-right:8px}.score{font-size:3rem;font-weight:900;color:var(--blue)}.toast{position:fixed;right:16px;bottom:16px;max-width:340px;padding:12px 16px;color:#fff;background:var(--navy);border-radius:13px;opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.buttons .btn{flex:1}.card{border-radius:19px}}
  </style>
</head>
<body><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='speakFancyGitHubV1';
const questions=[
 'What do you usually do after school?',
 'What is your favourite school subject?',
 'How do you spend your weekends?',
 'Who is a person you admire?',
 'What is your favourite place in Sabah?',
 'How do you help your family at home?',
 'What activity helps you relax?',
 'What is one skill you want to learn?'
];
const stages=['plan','attempt1','revise','attempt2','result'];
let mediaRecorder=null,stream=null,chunks=[],timerId=null,meterId=null,audioContext=null,startedAt=0,currentAttempt=0,recorded={1:false,2:false};
const app=document.querySelector('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||null}catch{return null}};
const fresh=name=>({name,stage:'plan',question:questions[Math.floor(Math.random()*questions.length)],transition:'',answer:'',detail:'',revision:'',tokens:0,badge:'',completed:false,score:0,updatedAt:new Date().toISOString()});
const save=p=>{p.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(p))};
const toast=m=>{const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};
const layout=body=>`<div class="shell"><header class="top"><div><div class="brand">🗺️ Speak FANCY</div><small>SPM Speaking · Part 1</small></div><span class="pill">⚡ ${load()?.tokens||0}</span></header>${body}</div>`;
function welcome(){cleanup();app.innerHTML=layout(`<section class="card hero"><p class="eyebrow">Your speaking treasure hunt</p><h1>Find your voice.</h1><p>Build a short answer, record it twice, improve it, and earn your first speaking badge.</p><div class="buttons"><button class="btn" data-go="start">Start the Mission →</button></div></section><section class="card"><h2>Your journey</h2><div class="grid"><article class="mini"><h3>1. Plan</h3><p>Give a direct answer and one relevant detail.</p></article><article class="mini"><h3>2. Speak</h3><p>Record, listen, and improve your response.</p></article><article class="mini"><h3>3. Grow</h3><p>Complete a practice assessment and collect a badge.</p></article></div></section><section class="card"><div class="grid"><article class="mini"><h3>Part 1</h3><span class="stage">Available</span></article><article class="mini locked"><h3>Part 2</h3><span class="stage">Coming Soon</span></article><article class="mini locked"><h3>Part 3</h3><span class="stage">Coming Soon</span></article></div></section>`)}
function start(){let p=load();if(p)return render(p);app.innerHTML=layout(`<section class="card"><p class="eyebrow">Create your student profile</p><h1>What should we call you?</h1><div class="field"><label for="name">Nickname</label><input id="name" maxlength="24" autocomplete="nickname" placeholder="Example: Aina"></div><div id="nameError"></div><button class="btn primary" data-go="save-name">Continue →</button></section>`)}
function nav(p){const i=stages.indexOf(p.stage),pct=Math.round(((i+1)/stages.length)*100);return `<section class="card"><div class="buttons"><strong>${esc(p.name)} · ${pct}% complete</strong><button class="btn secondary" data-go="home">Home</button></div><div class="progress" role="progressbar" aria-valuenow="${pct}"><div style="width:${pct}%"></div></div></section>`}
function question(p){return `<div class="question"><strong>Your interview question</strong><p>${esc(p.question)}</p></div>`}
function render(p){cleanup();recorded={1:!!p.attempt1Recorded,2:!!p.attempt2Recorded};const views={plan,attempt1,revise,attempt2,result};app.innerHTML=layout(nav(p)+views[p.stage](p))}
function plan(p){return `<section class="card"><p class="eyebrow">Step 1 · Understand and plan</p><h1>Answer + Detail</h1>${question(p)}<div class="tip"><strong>TAD tip:</strong> Transition is optional for a short Part 1 answer.</div><div class="field"><label for="transition">Transition (optional)</label><select id="transition"><option value="">No transition</option>${['For me,','Personally,','In my opinion,'].map(x=>`<option ${p.transition===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="answer">Direct answer</label><textarea id="answer" placeholder="Answer the question directly.">${esc(p.answer)}</textarea></div><div class="field"><label for="detail">One relevant detail</label><textarea id="detail" placeholder="Add a reason, example, place, time, or person.">${esc(p.detail)}</textarea></div><div id="planFeedback"></div><button class="btn primary" data-go="check-plan">Check My Plan →</button></section>`}
function response(p,text=p.revision||[p.transition,p.answer,p.detail].filter(Boolean).join(' ')){return `<div class="question"><strong>Question</strong><p>${esc(p.question)}</p><strong>Your response</strong><p>${esc(text)}</p></div>`}
function recorder(n,title){return `<div class="recorder" data-rec="${n}"><div class="rec-head"><div><h3>${title}</h3><small>Your audio stays on this device and is not uploaded.</small></div><span class="rec-status" id="status${n}">Ready</span></div><div class="meter"><div id="meter${n}"></div></div><p class="timer" id="timer${n}">00:00</p><div class="buttons"><button class="btn danger" data-record="start" data-attempt="${n}">🎙️ Record</button><button class="btn secondary" data-record="stop" data-attempt="${n}" disabled>■ Stop</button></div><div id="audio${n}"></div><div id="recMsg${n}" class="small"></div></div>`}
function attempt1(p){return `<section class="card"><p class="eyebrow">Step 2 · First try</p><h1>Speak clearly</h1>${response(p,[p.transition,p.answer,p.detail].filter(Boolean).join(' '))}${recorder(1,'Record Attempt 1')}<div class="checks"><label><input type="checkbox" id="clear1"> I spoke clearly enough to understand.</label><label><input type="checkbox" id="detail1"> I included my answer and detail.</label></div><div id="attemptFeedback"></div><button class="btn primary" data-go="finish-attempt1">Get Feedback →</button></section>`}
function revise(p){return `<section class="card"><p class="eyebrow">Step 3 · Feedback and revision</p><h1>Make it stronger</h1>${question(p)}<div class="feedback good"><strong>You have the right structure.</strong><p>Your response answers the question and includes a supporting detail.</p></div><div class="feedback improve"><strong>Focus for Attempt 2</strong><p>Use a complete sentence, connect your ideas smoothly, and speak at a calm pace.</p></div><div class="field"><label for="revision">Improved response</label><textarea id="revision">${esc(p.revision||[p.transition,p.answer,p.detail].filter(Boolean).join(' '))}</textarea></div><div id="revisionFeedback"></div><button class="btn primary" data-go="save-revision">Save Improvement →</button></section>`}
function attempt2(p){return `<section class="card"><p class="eyebrow">Step 4 · Speak again</p><h1>Show your improvement</h1>${response(p)}${recorder(2,'Record Attempt 2')}<div class="checks"><label><input type="checkbox" id="clear2"> My voice was clear and calm.</label><label><input type="checkbox" id="natural2"> I tried to sound natural, not memorised.</label></div><div id="attemptFeedback"></div><button class="btn success" data-go="finish-attempt2">View Practice Assessment →</button></section>`}
function result(p){return `<section class="card"><p class="eyebrow">Mission complete</p><h1>Well done, ${esc(p.name)}!</h1><div class="score">${p.score}/10</div><p><strong>Practice level:</strong> ${p.score>=8?'Confident Builder':p.score>=6?'Developing Speaker':'Brave Starter'}</p><div class="feedback good"><strong>What you did well</strong><p>You gave a direct answer, supported it with a relevant detail, and completed two speaking attempts.</p></div><div class="feedback improve"><strong>Next target</strong><p>Continue practising clear pronunciation, natural pace, and connected sentences.</p></div><div class="tip"><strong>🏅 Badge earned:</strong> ${esc(p.badge||'Interview Explorer')}<br><strong>Reward:</strong> +45 tokens</div><div class="buttons"><button class="btn primary" data-go="retry">Try Another Question</button><button class="btn secondary" data-go="home">Home</button></div></section>`}
function checkPlan(){const p=load(),a=document.querySelector('#answer').value.trim(),d=document.querySelector('#detail').value.trim(),t=document.querySelector('#transition').value,issues=[];if(words(a)<4)issues.push('Write a complete direct answer of at least four words.');if(words(d)<5)issues.push('Add one relevant detail of at least five words.');if(issues.length){document.querySelector('#planFeedback').innerHTML=`<div class="feedback improve"><strong>One more step</strong><ul>${issues.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;return}Object.assign(p,{answer:a,detail:d,transition:t,stage:'attempt1'});save(p);render(p)}
function finishAttempt(n){const p=load(),ok=recorded[n]&&document.querySelector(`#clear${n}`)?.checked&&document.querySelector(n===1?'#detail1':'#natural2')?.checked;if(!ok){document.querySelector('#attemptFeedback').innerHTML='<div class="feedback improve"><strong>Complete this speaking step</strong><p>Record your answer and tick both self-check boxes.</p></div>';return}p[`attempt${n}Recorded`]=true;p.stage=n===1?'revise':'result';if(n===2){p.completed=true;p.score=Math.min(10,5+(words(p.revision)>=12?2:1)+(p.transition?1:0)+2);p.tokens=45;p.badge='Interview Explorer'}save(p);render(p)}
function saveRevision(){const p=load(),r=document.querySelector('#revision').value.trim();if(words(r)<9){document.querySelector('#revisionFeedback').innerHTML='<div class="feedback improve"><strong>Add a little more.</strong><p>Your improved response should have at least nine words.</p></div>';return}p.revision=r;p.stage='attempt2';save(p);render(p)}
async function beginRecording(n){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){document.querySelector(`#recMsg${n}`).textContent='Recording is not supported here. Open the published HTTPS link in Chrome, Edge, or Safari.';return}try{cleanup();stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];currentAttempt=n;const types=['audio/webm;codecs=opus','audio/webm','audio/mp4'];const type=types.find(x=>MediaRecorder.isTypeSupported(x));mediaRecorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=()=>finishRecording(n,type||mediaRecorder.mimeType);mediaRecorder.start();startedAt=Date.now();document.querySelector(`#status${n}`).textContent='Recording';document.querySelector(`#status${n}`).classList.add('live');document.querySelector(`[data-record="start"][data-attempt="${n}"]`).disabled=true;document.querySelector(`[data-record="stop"][data-attempt="${n}"]`).disabled=false;timerId=setInterval(()=>{const s=Math.floor((Date.now()-startedAt)/1000);document.querySelector(`#timer${n}`).textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;if(s>=60)stopRecording()},250);try{audioContext=new (window.AudioContext||window.webkitAudioContext)();const analyser=audioContext.createAnalyser(),source=audioContext.createMediaStreamSource(stream),data=new Uint8Array(analyser.frequencyBinCount);source.connect(analyser);const tick=()=>{if(!mediaRecorder||mediaRecorder.state!=='recording')return;analyser.getByteFrequencyData(data);document.querySelector(`#meter${n}`).style.width=Math.min(100,data.reduce((a,b)=>a+b,0)/data.length*1.5)+'%';meterId=requestAnimationFrame(tick)};tick()}catch{} }catch(e){document.querySelector(`#recMsg${n}`).textContent=e.name==='NotAllowedError'?'Microphone permission was blocked. Allow microphone access in your browser settings, then reload the page.':'The microphone could not start. Close other apps using it and try again.'}}
function stopRecording(){if(mediaRecorder?.state==='recording')mediaRecorder.stop()}
function finishRecording(n,type){clearInterval(timerId);cancelAnimationFrame(meterId);const blob=new Blob(chunks,{type:type||'audio/webm'}),url=URL.createObjectURL(blob);recorded[n]=true;document.querySelector(`#status${n}`).textContent='Recorded';document.querySelector(`#status${n}`).classList.remove('live');document.querySelector(`#meter${n}`).style.width='0';document.querySelector(`#audio${n}`).innerHTML=`<audio controls src="${url}"></audio>`;document.querySelector(`[data-record="start"][data-attempt="${n}"]`).disabled=false;document.querySelector(`[data-record="stop"][data-attempt="${n}"]`).disabled=true;document.querySelector(`#recMsg${n}`).textContent='Listen to your recording, then complete the self-check.';releaseStream();toast('Recording complete!')}
function releaseStream(){stream?.getTracks().forEach(t=>t.stop());stream=null;if(audioContext){audioContext.close().catch(()=>{});audioContext=null}}
function cleanup(){clearInterval(timerId);cancelAnimationFrame(meterId);if(mediaRecorder?.state==='recording'){mediaRecorder.onstop=null;mediaRecorder.stop()}mediaRecorder=null;releaseStream()}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.record){b.dataset.record==='start'?beginRecording(Number(b.dataset.attempt)):stopRecording();return}switch(b.dataset.go){case'home':welcome();break;case'start':start();break;case'save-name':{const n=document.querySelector('#name').value.trim();if(n.length<2){document.querySelector('#nameError').innerHTML='<p class="feedback improve">Please enter at least two characters.</p>';return}const p=fresh(n);save(p);render(p);break}case'check-plan':checkPlan();break;case'finish-attempt1':finishAttempt(1);break;case'save-revision':saveRevision();break;case'finish-attempt2':finishAttempt(2);break;case'retry':{const old=load(),p=fresh(old.name);p.tokens=old.tokens;p.badge=old.badge;save(p);render(p);break}}});
window.addEventListener('beforeunload',cleanup);welcome();
})();
</script></body></html>
